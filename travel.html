<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <a href="index.html" class="back-link">← 메인으로 돌아가기</a>
        <header>
            <h1>✈️ 여행 (Travel)</h1>
            <p>여행에 필요한 영어 회화</p>
        </header>
        
        <div class="scenario-list">
            <a href="travel_booking.html" class="scenario-item">
                <div class="scenario-icon">🏨</div>
                <div class="scenario-info">
                    <div class="scenario-name">호텔 예약 (Hotel Booking)</div>
                    <div class="scenario-desc">예약, 변경, 취소, 요금 문의</div>
                </div>
                <div class="scenario-count">5개 대화</div>
            </a>
            
            <a href="travel_tips.html" class="scenario-item">
                <div class="scenario-icon">💡</div>
                <div class="scenario-info">
                    <div class="scenario-name">여행 팁 (Travel Tips)</div>
                    <div class="scenario-desc">환전, 유심카드, 팁 문화, 현지 예절</div>
                </div>
                <div class="scenario-count">4개 대화</div>
            </a>
            
            <a href="travel_emergency.html" class="scenario-item">
                <div class="scenario-icon">🚨</div>
                <div class="scenario-info">
                    <div class="scenario-name">비상 상황 (Emergency Abroad)</div>
                    <div class="scenario-desc">여권 분실, 의료 응급, 짐 분실, 도난</div>
                </div>
                <div class="scenario-count">4개 대화</div>
            </a>
            
            <a href="travel_sightseeing.html" class="scenario-item">
                <div class="scenario-icon">🗺️</div>
                <div class="scenario-info">
                    <div class="scenario-name">관광지 (Tourist Spots)</div>
                    <div class="scenario-desc">박물관, 길 찾기, 티켓 구매, 사진 요청</div>
                </div>
                <div class="scenario-count">4개 대화</div>
            </a>
        </div>
        
        <footer>
            <p>🗣️ English Talk - 상황별 영어 회화 학습</p>
