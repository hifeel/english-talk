<!-- 메인 화면은 두 가지 안을 보관합니다.
     index-a.html  A안 - 격자 타일 + 막대 진도
     index-b.html  B안 - 아이콘을 감싼 원형 진도 링
     이 파일(index.html)은 그중 지금 쓰는 안의 사본입니다. 바꾸려면 원본을
     덮어쓰기만 하면 됩니다: cp index-b.html index.html
     하위 화면의 '메인' 링크는 전부 index.html 을 가리키므로 링크는 손댈 것이 없습니다.
     현재: A안 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>English Talk - 상황별 영어 회화</title>
</head>
<body>
<div class="container">
  <header>
    <h1>🗣️ English Talk</h1>
    <p>상황별 영어 회화</p>
  </header>

  <p class="note">진행률과 북마크는 이 기기에만 저장됩니다.</p>

  <div class="progress" id="overall"></div>
  <button class="recommend" id="recommendBtn" disabled>오늘 공부할 거 고르는 중…</button>
  <div id="marksLink"></div>
  <div class="tiles" id="list"></div>

  <footer>제작: hyundam</footer>
</div>

<script src="data.js"></script>
<script>
function build() {
  v2LoadAll().then(function (cats) {
    var html = '';
    for (var i = 0; i < cats.length; i++) {
      var c = cats[i];
      var sentences = 0;
      for (var j = 0; j < c.scenarios.length; j++) sentences += c.scenarios[j].dialogues.length;
      var p = v2CategoryProgress(c);
      html +=
        '<a class="tile' + (p.total && p.done === p.total ? ' done' : '') +
        '" href="category.html?cat=' + encodeURIComponent(c.key) + '">' +
        '<div class="tile-icon">' + v2Esc(c.icon || '💬') + '</div>' +
        '<div class="tile-title">' + v2Esc(c.title) + '</div>' +
        '<div class="tile-sub">' + c.scenarios.length + '개 · ' + sentences + '문장</div>' +
        '<div class="track"><div class="fill" style="width:' + p.percent + '%"></div></div>' +
        '<div class="tile-num">' + p.done + ' / ' + p.total + '</div>' +
        '</a>';
    }
    document.getElementById('list').innerHTML = html;

    var o = v2TotalProgress(cats);
    document.getElementById('overall').innerHTML =
      '<div class="progress-text">📚 전체 진행률 ' + o.done + ' / ' + o.total +
      ' 시나리오 (' + o.percent + '%)</div>' +
      '<div class="track"><div class="fill" style="width:' + o.percent + '%"></div></div>';

    // Only offer the review page once there is something on it
    var n = v2MarkCount();
    document.getElementById('marksLink').innerHTML = n
      ? '<a class="marks-link" href="marks.html">⭐ 북마크한 문장 ' + n + '개</a>' : '';

    HOME_CATS = cats;
    paintRecommend();
  });
}

/* ---- today's pick ----
 * 161 scenarios is enough that choosing one is its own small obstacle, so this
 * makes the choice: a scenario that is not marked done yet, at random, entered
 * straight away. Once everything is done it keeps working as a way back in to
 * something at random rather than going dead.
 */
var HOME_CATS = null;

function undoneScenarios(cats) {
  var done = v2GetDone(), pool = [];
  for (var i = 0; i < cats.length; i++) {
    for (var j = 0; j < cats[i].scenarios.length; j++) {
      if (!done[cats[i].scenarios[j].key]) {
        pool.push({ cat: cats[i], scenario: cats[i].scenarios[j] });
      }
    }
  }
  return pool;
}

function allScenarios(cats) {
  var pool = [];
  for (var i = 0; i < cats.length; i++) {
    for (var j = 0; j < cats[i].scenarios.length; j++) {
      pool.push({ cat: cats[i], scenario: cats[i].scenarios[j] });
    }
  }
  return pool;
}

function paintRecommend() {
  var btn = document.getElementById('recommendBtn');
  if (!btn || !HOME_CATS) return;
  var left = undoneScenarios(HOME_CATS).length;
  btn.disabled = false;
  btn.innerHTML = left
    ? '🎯 오늘 공부할 거 추천<span class="sub">아직 안 한 ' + left + '개 중에서 하나</span>'
    : '🎉 전부 완료했습니다<span class="sub">아무거나 하나 다시 보기</span>';
}

function goRecommended() {
  if (!HOME_CATS) return;
  var pool = undoneScenarios(HOME_CATS);
  if (!pool.length) pool = allScenarios(HOME_CATS);
  if (!pool.length) return;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  location.href = 'scenario.html?cat=' + encodeURIComponent(pick.cat.key) +
                  '&name=' + encodeURIComponent(pick.scenario.key);
}

document.getElementById('recommendBtn').addEventListener('click', goRecommended);
build();
// Coming back from the bookmark or dialogue page should show the new progress
window.addEventListener('pageshow', function (e) { if (e.persisted) build(); });
</script>
<script src="pwa.js"></script>
</body>
</html>
