<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 가격 & 할인 - 쇼핑 영어 회화</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="toggle.css">


</head>
<body>
    <div class="container">
        <header>
            <a href="shopping.html" class="back-link">← 쇼핑 목록으로</a>
            <h1>💰 가격 & 할인</h1>
            <p>가격 문의, 할인 확인</p>
        </header>
        
        
        <!-- Control Bar -->
        
        <!-- Control Bar -->
        
        <!-- Control Bar -->
        <div class="control-bar">
            <div class="toggle-container">
                <button id="toggleEnglishBtn" class="toggle-btn" onclick="toggleEnglish()">영어 ON</button>
                <button id="toggleKoreanBtn" class="toggle-btn" onclick="toggleKorean()">한국어 ON</button>
                <button id="toggleSpeakerBtn" class="toggle-btn" onclick="toggleSpeaker()">화자 ON</button>
                <button id="repeatBtn" class="repeat-btn" onclick="toggleRepeat()">반복 OFF</button>
            </div>
            <div class="play-controls">
                <button id="playAllBtn" class="play-all-btn" onclick="togglePlayAll()">
                    <span id="playAllIcon">▶️</span>
                    <span id="playAllText">전체 재생</span>
                </button>
                <div id="playAllProgress" class="play-all-progress" style="display: none;">
                    <span id="progressText">0 / 0</span>
                </div>
            </div>
        </div>
<div class="scenario">
            <div class="dialogue">
                <div class="speaker">Customer</div>
                <div class="english">How much is this?</div>
                <div class="korean">이거 얼마인가요?</div>
                <div class="audio-controls">
                    <audio controls src="audio/shop_10.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Staff</div>
                <div class="english">It's 50 dollars.</div>
                <div class="korean">50달러입니다.</div>
                <div class="audio-controls">
                    <audio controls src="audio/shop_11.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Customer</div>
                <div class="english">Is there a discount?</div>
                <div class="korean">할인 있나요?</div>
                <div class="audio-controls">
                    <audio controls src="audio/shop_12.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Staff</div>
                <div class="english">Yes, it's 20% off today.</div>
                <div class="korean">네, 오늘 20% 할인입니다.</div>
                <div class="audio-controls">
                    <audio controls src="audio/shop_13.mp3"></audio>
                </div>
            </div>
        </div>
        
        <div class="page-nav">
    <a href="shopping_fitting.html">← 이전: 피팅</a>
    <a href="shopping_payment.html">다음: 결제 →</a>
</div>
<footer>
            <p>🗣️ English Talk - 상황별 영어 회화 학습</p>
            <p>제작: Hermes Agent</p>
        </footer>
    </div>
    

        <script src="play-all.js"></script>
    <script src="toggle.js"></script>
