<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>English Talk</title>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="crumb" id="crumb"></div>
    <button type="button" class="toggle-btn" id="doneBtn">☐ 완료</button>
  </div>

  <h1 class="lesson-title" id="title"></h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="toolbar">
    <div class="toggles">
      <button class="toggle-btn" id="toggleEn"><span class="dot"></span> 영어</button>
      <button class="toggle-btn" id="toggleKo"><span class="dot"></span> 한국어</button>
      <button class="toggle-btn" id="toggleSpeaker"><span class="dot"></span> 화자</button>
      <button class="toggle-btn" id="toggleRepeat"><span class="dot"></span> 반복</button>
    </div>
    <button class="play-all-btn" id="playAllBtn">▶ 전체 재생</button>
  </div>

  <div class="dialogue" id="dialogue"></div>
  <div class="page-nav" id="pageNav"></div>

  <footer>제작: hyundam</footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
var GICON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>' +
  '<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>' +
  '<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>' +
  '<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';

var catKey = v2Param('cat');
var name = v2Param('name');
var scenario = null;

function syncDone() {
  var btn = document.getElementById('doneBtn');
  var on = v2IsDone(scenario.key);
  btn.textContent = on ? '✔️ 완료됨' : '☐ 완료';
  btn.classList.toggle('off', !on);
}

function render(cat, s) {
  scenario = s;
  document.title = s.title + ' | English Talk';
  document.getElementById('crumb').innerHTML =
    '<a href="index.html">메인</a><span>›</span>' +
    '<a href="category.html?cat=' + encodeURIComponent(cat.key) + '">' + v2Esc(cat.title) + '</a>';
  document.getElementById('title').textContent = (s.icon || '') + ' ' + s.title;
  document.getElementById('subtitle').textContent = s.subtitle || '';
  syncDone();

  var box = document.getElementById('dialogue');
  box.innerHTML = '';

  s.dialogues.forEach(function (d, i) {
    var side = v2Side(d.speaker);
    var marked = v2IsMarked(s.key, i);
    var q = encodeURIComponent((d.en || '') + ' 이 영어 문장을 번역하고 설명해줘');

    var el = document.createElement('div');
    el.className = 'turn ' + side;
    el.setAttribute('data-src', v2AudioUrl(d.audio));
    el.innerHTML =
      '<div class="turn-btns">' +
      '<button class="mark-btn' + (marked ? ' marked' : '') + '" type="button"' +
      ' aria-pressed="' + (marked ? 'true' : 'false') + '" title="북마크">' +
      (marked ? '★' : '☆') + '</button>' +
      '<button class="play-btn" type="button">▶</button>' +
      '</div>' +
      '<div class="speaker ' + side + '">' + v2Esc(d.speaker) + '</div>' +
      '<div class="en">' + v2Esc(d.en) + '</div>' +
      '<div class="ko-line"><div class="ko">' + v2Esc(d.ko) + '</div>' +
      '<a class="search-btn" href="https://www.google.com/search?q=' + q +
      '" target="_blank" rel="noopener noreferrer">' + GICON + '</a></div>';

    el.addEventListener('click', function () { V2Player.playTurn(el); });
    el.querySelector('.play-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      V2Player.playTurn(el);
    });
    el.querySelector('.search-btn').addEventListener('click', function (e) {
      e.stopPropagation();
    });
    el.querySelector('.mark-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      var on = v2ToggleMark(s.key, i, d, cat.key);
      this.classList.toggle('marked', on);
      this.textContent = on ? '★' : '☆';
      this.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    box.appendChild(el);
  });

  // prev / next within the category
  var idx = -1;
  for (var j = 0; j < cat.scenarios.length; j++) {
    if (cat.scenarios[j].key === s.key) { idx = j; break; }
  }
  var nav = '';
  nav += idx > 0
    ? '<a href="lesson.html?cat=' + encodeURIComponent(cat.key) + '&name=' +
      encodeURIComponent(cat.scenarios[idx - 1].key) + '">← ' +
      v2Esc(cat.scenarios[idx - 1].title) + '</a>'
    : '<span></span>';
  nav += (idx >= 0 && idx < cat.scenarios.length - 1)
    ? '<a href="lesson.html?cat=' + encodeURIComponent(cat.key) + '&name=' +
      encodeURIComponent(cat.scenarios[idx + 1].key) + '">' +
      v2Esc(cat.scenarios[idx + 1].title) + ' →</a>'
    : '<span></span>';
  document.getElementById('pageNav').innerHTML = nav;
}

document.getElementById('doneBtn').addEventListener('click', function () {
  v2ToggleDone(scenario.key);
  syncDone();
});
document.getElementById('toggleEn').addEventListener('click', function () { V2Player.toggleLang('en'); });
document.getElementById('toggleKo').addEventListener('click', function () { V2Player.toggleLang('ko'); });
document.getElementById('toggleSpeaker').addEventListener('click', function () { V2Player.toggleLang('speaker'); });
document.getElementById('toggleRepeat').addEventListener('click', function () { V2Player.toggleRepeat(); });
document.getElementById('playAllBtn').addEventListener('click', function () { V2Player.playAll(); });

V2Player.applyStates();
V2Player.initKeyboard();

v2LoadCategory(catKey).then(function (cat) {
  if (!cat) { document.getElementById('title').textContent = '카테고리를 찾을 수 없습니다'; return; }
  var s = v2FindScenario(cat, name);
  if (!s) { document.getElementById('title').textContent = '대화문을 찾을 수 없습니다'; return; }
  render(cat, s);
});
</script>
</body>
</html>
