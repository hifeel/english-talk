<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 접수 - 병원 영어 회화</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="hospital.html" class="back-link">← 병원 목록으로</a>
            <h1>📋 접수 (Reception)</h1>
            <p>예약, 보험 정보</p>
        </header>
        
        <div class="play-all-container">
            <button id="playAllBtn" class="play-all-btn" onclick="togglePlayAll()">
                <span id="playAllIcon">▶️</span>
                <span id="playAllText">전체 재생</span>
            </button>
            <div id="playAllProgress" class="play-all-progress" style="display: none;">
                <span id="progressText">0 / 4</span>
            </div>
        </div>
        
        <div class="scenario">
            <div class="dialogue">
                <div class="speaker">Patient</div>
                <div class="english">I'd like to make an appointment.</div>
                <div class="korean">진료 예약을 하고 싶습니다.</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_1.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Staff</div>
                <div class="english">Do you have insurance?</div>
                <div class="korean">보험 있으신가요?</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_2.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Patient</div>
                <div class="english">Yes, here's my insurance card.</div>
                <div class="korean">네, 여기 보험 카드 있습니다.</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_3.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Staff</div>
                <div class="english">Please fill out this form.</div>
                <div class="korean">이 양식을 작성해주세요.</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_4.mp3"></audio>
                </div>
            </div>
        </div>
        
        <footer>
            <p>🗣️ English Talk - 상황별 영어 회화 학습</p>
            <p>제작: Hermes Agent</p>
        </footer>
    </div>
    
    <script src="play-all.js"></script>
</body>
</html>
