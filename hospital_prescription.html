<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💊 처방전 - 병원 영어 회화</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="toggle.css">


</head>
<body>
    <div class="container">
        <header>
            <div style="display:flex;gap:10px;margin-bottom:15px;">
            <a href="index.html" class="back-link">🏠 메인</a>
            <a href="hospital.html" class="back-link">← 병원 목록으로</a>
        </div>
            <h1>💊 처방전 (Prescription)</h1>
            <p>약 복용법, 설명</p>
        </header>
        
        
        <!-- Control Bar -->
        
        <!-- Control Bar -->
        
        <!-- Control Bar -->
        
        <!-- Control Bar -->
        <div class="control-bar">
            <div class="toggle-container">
                <button id="toggleEnglishBtn" class="toggle-btn" onclick="toggleEnglish()">영어</button>
                <button id="toggleKoreanBtn" class="toggle-btn" onclick="toggleKorean()">한국어</button>
                <button id="toggleSpeakerBtn" class="toggle-btn" onclick="toggleSpeaker()">화자</button>
                <button id="repeatBtn" class="repeat-btn" onclick="toggleRepeat()">반복</button>
            </div>
            <div class="play-controls">
                <div id="playAllProgress" class="play-all-progress" style="display: none;">
                    <span id="progressText">0 / 0</span>
                </div>
                <button id="playAllBtn" class="play-all-btn" onclick="togglePlayAll()">
                    <span id="playAllIcon">▶️</span>
                </button>
            </div>
        </div>
<div class="scenario">
            <div class="dialogue">
                <div class="speaker">Doctor</div>
                <div class="english">You have a cold. Take this medicine.</div>
                <div class="korean">감기네요. 이 약을 드세요.</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_12.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Patient</div>
                <div class="english">How often should I take it?</div>
                <div class="korean">하루에 몇 번 먹어야 하나요?</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_13.mp3"></audio>
                </div>
            </div>
            
            <div class="dialogue">
                <div class="speaker">Doctor</div>
                <div class="english">Three times a day after meals.</div>
                <div class="korean">식후 하루 세 번 드세요.</div>
                <div class="audio-controls">
                    <audio controls src="audio/hospital_14.mp3"></audio>
                </div>
            </div>
        </div>

    <a href="hospital_examination.html">← 이전: 진찰</a>

</div>
<footer>
            <p>🗣️ English Talk - 상황별 영어 회화 학습</p>
            <p>제작: Hermes Agent</p>
        </footer>
    </div>
